<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK3568 智能网关控制系统</title>
    <style>
        :root {
            --primary: #5c67f2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --bg: #f0f2f5;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 0 25px;
            border-radius: 16px;
            min-height: 60px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* 通讯方式切换按钮 */
        .link-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 3px;
            gap: 3px;
        }

        .link-switch button {
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            padding: 4px 14px;
            border-radius: 17px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .link-switch button.active {
            background: white;
            color: var(--primary);
        }

        /* 主区域布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1f2937;
        }

        /* 视频区域 */
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            flex: 1;
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        /* 按钮通用 */
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 13px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cap {
            background: var(--success);
        }

        .btn-rec {
            background: var(--danger);
        }

        .btn-stream-start {
            background: var(--info);
        }

        .btn-stream-stop {
            background: #64748b;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 控制面板 */
        .control-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #edf2f7;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--primary);
        }

        .dir-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-dir {
            background: #e2e8f0;
            color: #64748b;
            padding: 6px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-dir.active {
            background: #fff;
            color: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }

        /* 开关手柄 */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        /* 日志窗口 */
        .log-container {
            background: #0f172a;
            color: #38bdf8;
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            border: 1px solid #1e293b;
            min-height: 150px;
        }

        .log-line {
            margin-bottom: 4px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2px;
        }

        .log-time {
            color: #94a3b8;
            margin-right: 8px;
        }

        /* 底部传感器卡片 */
        .sensor-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .s-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .s-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin: 4px 0;
        }

        .s-unit {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="header">
        <div style="font-size: 20px; font-weight: 800; letter-spacing: 1px;">RK3568 智能网关控制系统</div>
        <div class="header-right">
            <!-- 通讯方式切换 (MQTT / Zigbee) -->
            <div class="link-switch" id="linkSwitch">
                <button class="active" data-link="mqtt" onclick="switchLink('mqtt')">📡 MQTT</button>
                <button data-link="zigbee" onclick="switchLink('zigbee')">📶 Zigbee</button>
            </div>
            <div class="status-tag" id="conn_status">● 连接中...</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左侧 -->
        <div class="column">
            <div class="card" style="flex: 1;">
                <div class="card-title">🎥 实时画面监控</div>
                <div class="video-box">
                    <!-- 视频: 用 <img> 显示 MJPEG 流 -->
                    <img id="videoPlayer" src="" alt="视频流未启动">
                    <!-- 抓拍缩略图: 显示在视频右下角, 不影响视频流 -->
                    <img id="snapshotThumb" src="" alt=""
                         style="position:absolute; right:10px; bottom:10px;
                                width:120px; height:90px; object-fit:cover;
                                border:2px solid #fff; border-radius:8px;
                                display:none; box-shadow:0 4px 12px rgba(0,0,0,.5);">
                </div>
                <div class="video-bar">
                    <button id="streamStartBtn" class="btn btn-stream-start">▶ 开始推流</button>
                    <button id="streamStopBtn" class="btn btn-stream-stop" disabled>⏹ 停止推流</button>
                    <button id="snapshotBtn" class="btn btn-cap">📸 抓拍照片</button>
                    <button id="recordBtn" class="btn btn-rec">🔴 视频录制</button>
                </div>
            </div>

            <div class="sensor-row">
                <div class="s-card">
                    <div>温度</div>
                    <div class="s-val" id="val_temp">--</div>
                    <div class="s-unit">°C</div>
                </div>
                <div class="s-card">
                    <div>湿度</div>
                    <div class="s-val" id="val_humi">--</div>
                    <div class="s-unit">% RH</div>
                </div>
                <div class="s-card">
                    <div>光照强度</div>
                    <div class="s-val" id="val_light">--</div>
                    <div class="s-unit">Lux</div>
                </div>
                <div class="s-card">
                    <div>红外检测</div>
                    <div class="s-val" id="val_ir" style="font-size:16px;">--</div>
                    <div class="s-unit">Status</div>
                </div>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="column">
            <!-- 控制卡片 -->
            <div class="card">
                <div class="card-title">⚙️ 硬件外设控制</div>

                <div class="control-item">
                    <div class="label-row"><span>LED 照明灯</span><label class="switch"><input type="checkbox" id="led_sw"
                                onchange="updateLed()"><span class="slider"></span></label></div>
                    <input type="range" id="led_br" value="50" onchange="updateLed()">
                </div>

                <div class="control-item">
                    <div class="label-row"><span>直流电机控制</span><label class="switch"><input type="checkbox" id="motor_sw"
                                onchange="updateMotor()"><span class="slider"></span></label></div>
                    <input type="range" id="motor_sp" value="30" onchange="updateMotor()">
                    <div class="dir-btns">
                        <button id="dir_f" class="btn-dir active" onclick="setMotorDirUser(0)">正向旋转</button>
                        <button id="dir_r" class="btn-dir" onclick="setMotorDirUser(1)">反向旋转</button>
                    </div>
                </div>

                <div class="control-item">
                    <div class="label-row"><span>舵机角度</span><span id="servo_ag_val"
                                style="font-weight:800;color:var(--primary);">90°</span></div>
                    <input type="range" id="servo_ag" value="90" min="0" max="180"
                           oninput="document.getElementById('servo_ag_val').textContent = this.value + '°';"
                           onchange="updateServo()">
                </div>

                <div class="control-item" style="border-left: 4px solid var(--warning); margin-bottom: 0;">
                    <div class="label-row"><span>紧急蜂鸣报警</span><label class="switch"><input type="checkbox"
                                id="buzzer_sw" onchange="updateBuzzer()"><span class="slider"></span></label></div>
                </div>
            </div>

            <!-- 日志卡片 -->
            <div class="card" style="flex: 1; min-height: 0;">
                <div class="card-title">📜 系统运行日志</div>
                <div class="log-container" id="log_box">
                    <div class="log-line"><span class="log-time">[--:--:--]</span>系统初始化完成...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
// ======================================================================
// index.html 关键 JS 部分更新
// 改动: 拍照显示 + 视频流 (轮询 last_photo 准实时)
// ======================================================================

// ========== 配置 ==========
const WS_URL = 'ws://' + location.hostname + ':8082';      // WebSocket 实时推送

// ========== 全局状态 ==========
let currentDir = 0;
let streamStarted = false;
let recordStarted = false;
let currentLink = 'mqtt';   // 当前通讯方式: mqtt / zigbee
let streamTimer = null;     // 视频流刷新定时器
let snapTimer = null;       // 拍照显示定时器

// DOM 元素
const video = document.getElementById('videoPlayer');
const streamStartBtn = document.getElementById('streamStartBtn');
const streamStopBtn = document.getElementById('streamStopBtn');
const snapshotBtn = document.getElementById('snapshotBtn');
const recordBtn = document.getElementById('recordBtn');

// ========== 日志 ==========
function addLog(msg) {
    const box = document.getElementById('log_box');
    const time = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    while (box.children.length > 100) box.removeChild(box.firstChild);
}

// ========== 通用请求 ==========
async function sendCommand(url, options = {}) {
    try {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    } catch (err) {
        addLog(`接口请求失败: ${err.message}`);
        console.error('API Error:', err);
        throw err;
    }
}

// ========== WebSocket 实时推送 ==========
let ws = null;
function connectWS() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
        document.getElementById('conn_status').textContent = '● 设备在线';
        document.getElementById('conn_status').style.color = '#fff';
        addLog('✅ WebSocket 已连接 (实时推送)');
    };
    ws.onmessage = (e) => {
        try {
            const data = JSON.parse(e.data);
            renderStatus(data);
        } catch (err) {
            addLog('⚠️ 推送数据解析失败');
        }
    };
    ws.onclose = () => {
        document.getElementById('conn_status').textContent = '● 连接断开';
        document.getElementById('conn_status').style.color = '#ff4d4d';
        setTimeout(connectWS, 3000);
    };
    ws.onerror = () => ws.close();
}

// ========== 渲染传感器/状态 ==========
function renderStatus(data) {
    const devices = data.devices || [];
    const dev = devices.find(d => d.dev_id === 'mcu01');
    if (!dev) return;

    document.getElementById('val_temp').innerText = (dev.temp !== undefined) ? dev.temp.toFixed(1) : '--';
    document.getElementById('val_humi').innerText = (dev.humi !== undefined) ? dev.humi.toFixed(1) : '--';
    document.getElementById('val_light').innerText = (dev.light !== undefined) ? dev.light : '--';

    const irBox = document.getElementById('val_ir');
    if (dev.ir !== undefined) {
        irBox.innerText = dev.ir ? "☢ 有人" : "安全";
        irBox.style.color = dev.ir ? "var(--danger)" : "var(--success)";
    }

    document.getElementById('led_sw').checked = !!dev.led_on;
    if (dev.led_brightness !== undefined) document.getElementById('led_br').value = dev.led_brightness;
    document.getElementById('motor_sw').checked = !!dev.fan_on;
    if (dev.fan_speed !== undefined) document.getElementById('motor_sp').value = dev.fan_speed;
    if (dev.fan_dir !== undefined) setMotorDirUI(dev.fan_dir);
    if (dev.servo_angle !== undefined) {
        document.getElementById('servo_ag').value = dev.servo_angle;
        document.getElementById('servo_ag_val').textContent = dev.servo_angle + '°';
    }
    document.getElementById('buzzer_sw').checked = !!dev.beep_on;
}

// ========== 轮询兜底 ==========
function pollStatus() {
    fetch('/api/status').then(r => r.json()).then(data => {
        renderStatus(data);
        document.getElementById('conn_status').textContent = '● 设备在线';
    }).catch(() => {
        document.getElementById('conn_status').textContent = '● 连接断开';
        document.getElementById('conn_status').style.color = '#ff4d4d';
    });
}

// ========== 控制命令 ==========
async function sendControl(target, params) {
    const payload = {
        type: 'cmd',
        dev: 'mcu01',
        msg_id: 'web-' + Date.now(),
        ts: Math.floor(Date.now() / 1000),
        body: { target: target, action: 'set', params: params }
    };
    addLog(`发送指令: ${target} ${JSON.stringify(params)}`);
    try {
        const res = await fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        addLog(result.ok ? `✅ ${target} 指令已发送` : `❌ ${target} 指令失败`);
    } catch (err) {
        addLog(`指令发送失败: ${err.message}`);
    }
}

// ========== LED ==========
function updateLed() {
    const sw = document.getElementById('led_sw').checked;
    const br = parseInt(document.getElementById('led_br').value);
    addLog(`LED: ${sw ? '开启' : '关闭'}, 亮度 ${br}%`);
    sendControl('led', { on: sw ? 1 : 0, brightness: br });
}

// ========== 电机 ==========
function updateMotor() {
    const sw = document.getElementById('motor_sw').checked;
    const sp = parseInt(document.getElementById('motor_sp').value);
    sendControl('fan', { on: sw ? 1 : 0, speed: sp, dir: currentDir });
}

function setMotorDirUI(dir) {
    currentDir = dir;
    document.getElementById('dir_f').classList.toggle('active', dir === 0);
    document.getElementById('dir_r').classList.toggle('active', dir === 1);
}

function setMotorDirUser(dir) {
    setMotorDirUI(dir);
    addLog(`电机方向: ${dir === 0 ? '正转' : '反转'}`);
    sendControl('fan', {
        on: document.getElementById('motor_sw').checked ? 1 : 0,
        speed: parseInt(document.getElementById('motor_sp').value),
        dir: dir
    });
}

// ========== 蜂鸣器 ==========
function updateBuzzer() {
    const sw = document.getElementById('buzzer_sw').checked;
    addLog(`蜂鸣器: ${sw ? '响' : '停'}`);
    sendControl('beep', { on: sw ? 1 : 0 });
}

// ========== 舵机 ==========
function updateServo() {
    const angle = parseInt(document.getElementById('servo_ag').value);
    addLog(`舵机: ${angle}°`);
    sendControl('servo', { angle: angle });
}

// ========== 视频流 (轮询 last_photo 准实时) ==========
async function startStream() {
    if (streamStarted) return;
    addLog('正在启动视频流...');
    try {
        // 启动网关推流 (常驻 gst 进程)
        const resp = await fetch('/api/camera/start', { method: 'POST' });
        const result = await resp.json();
        if (!result.ok) {
            addLog('❌ 视频流启动失败: ' + (result.message || ''));
            return;
        }
        streamStarted = true;
        streamStartBtn.disabled = true;
        streamStopBtn.disabled = false;
        // img 指向 MJPEG 流, URL 加时间戳强制浏览器新建连接
        video.src = '/api/camera/stream?t=' + Date.now();
        addLog('✅ 视频流已连接 (MJPEG 15fps)');
    } catch (err) {
        addLog(`❌ 视频流启动失败: ${err.message}`);
    }
}

async function stopStream() {
    if (!streamStarted) return;
    try {
        await fetch('/api/camera/stop', { method: 'POST' });
    } catch (err) {
        // 忽略停止错误
    }
    video.src = '';
    streamStarted = false;
    streamStartBtn.disabled = false;
    streamStopBtn.disabled = true;
    addLog('⏹ 视频流已停止');
}

// ========== 抓拍 (拍照后显示照片) ==========
async function takeSnapshot() {
    try {
        addLog('正在拍照...');
        const resp = await fetch('/api/camera/snapshot', { method: 'POST' });
        const result = await resp.json();
        if (result.ok && result.data) {
            addLog('✅ 拍照成功');
            // 用 base64 data URI 直接显示 (绕开文件伺服, 立即完整)
            const dataUri = 'data:image/jpeg;base64,' + result.data;
            if (streamStarted) {
                // 推流中: 视频流不断! 照片显示在右下角缩略图
                const thumb = document.getElementById('snapshotThumb');
                if (thumb) {
                    thumb.src = dataUri;
                    thumb.style.display = 'block';
                }
            } else {
                // 未推流: video 直接显示照片
                video.src = dataUri;
            }
        } else {
            addLog('❌ 拍照失败: ' + (result.error || 'unknown'));
        }
    } catch (err) {
        addLog(`❌ 拍照失败: ${err.message}`);
    }
}

// ========== 录像 ==========
async function toggleRecord() {
    if (!streamStarted) {
        addLog('❌ 请先启动视频流再进行录像');
        return;
    }
    if (!recordStarted) {
        try {
            addLog('正在启动录像...');
            const resp = await fetch('/api/camera/start_record', { method: 'POST' });
            const result = await resp.json();
            if (result.ok) {
                recordStarted = true;
                recordBtn.innerHTML = '⏹ 停止录制';
                addLog('✅ 录像已开始');
            } else {
                addLog(`❌ 录像启动失败: ${result.error}`);
            }
        } catch (err) {
            addLog(`❌ 录像启动失败: ${err.message}`);
        }
    } else {
        try {
            addLog('正在停止录像...');
            await fetch('/api/camera/stop_record', { method: 'POST' });
            recordStarted = false;
            recordBtn.innerHTML = '🔴 视频录制';
            addLog('✅ 录像已保存');
        } catch (err) {
            addLog(`⚠️ 停止录像出错: ${err.message}`);
        }
    }
}

// ========== 通讯方式切换 ==========
async function switchLink(link) {
    if (link === currentLink) return;
    currentLink = link;
    document.querySelectorAll('#linkSwitch button').forEach(b => {
        b.classList.toggle('active', b.dataset.link === link);
    });
    // 通知网关切换通讯方式
    try {
        const resp = await fetch('/api/transport', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ transport: link })
        });
        const result = await resp.json();
        if (link === 'mqtt') {
            addLog('📡 通讯方式切换为: MQTT (WiFi 直连)');
        } else {
            addLog('📶 通讯方式切换为: Zigbee (DL-30 无线串口)');
        }
        addLog(`网关确认: ${result.transport}`);
    } catch (err) {
        addLog(`切换失败: ${err.message}`);
    }
}

// ========== 事件绑定 ==========
streamStartBtn.onclick = startStream;
streamStopBtn.onclick = stopStream;
snapshotBtn.onclick = takeSnapshot;
recordBtn.onclick = toggleRecord;

// ========== 初始化 ==========
connectWS();
setInterval(pollStatus, 3000);
addLog('[系统] 页面加载完成，设备控制就绪');
